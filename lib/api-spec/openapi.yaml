openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /extract:
    post:
      operationId: extractComplaint
      tags: [complaints]
      summary: Extract a complaint from supplied text or a supported document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractionInput"
      responses:
        "200":
          description: Extracted complaint and risk assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionResult"
  /copilot/chat:
    post:
      operationId: complaintCopilotChat
      tags: [complaints]
      summary: Ask the complaint intake copilot about the active complaint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopilotMessage"
      responses:
        "200":
          description: Copilot response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotReply"
  /complaints:
    post:
      operationId: createComplaint
      tags: [complaints]
      summary: Save a complaint record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintInput"
      responses:
        "201":
          description: Saved complaint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintRecord"
  /complaints/{id}:
    get:
      operationId: getComplaint
      tags: [complaints]
      summary: Retrieve a saved complaint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Complaint record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintRecord"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    ExtractionInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
        documentName: { type: string }
        documentType: { type: string }
    ComplaintFields:
      type: object
      required: [complaintSource, customerName, productName, strength, batch, manufacturingDate, expiryDate, quantity, complaintType, complaintDate, description, severity, priority]
      properties:
        complaintSource: { type: string }
        customerName: { type: string }
        productName: { type: string }
        strength: { type: string }
        batch: { type: string }
        manufacturingDate: { type: string }
        expiryDate: { type: string }
        quantity: { type: string }
        complaintType: { type: string }
        complaintDate: { type: string }
        description: { type: string }
        severity: { type: string }
        priority: { type: string }
    RiskAssessment:
      type: object
      required: [overallRisk, severityRationale, priorityRationale, patientSafetyImpact, productQualityImpact, recommendedActions, confidenceNotes, explanation]
      properties:
        overallRisk: { type: string }
        severityRationale: { type: string }
        priorityRationale: { type: string }
        patientSafetyImpact: { type: string }
        productQualityImpact: { type: string }
        recommendedActions: { type: array, items: { type: string } }
        confidenceNotes: { type: string }
        explanation: { type: array, items: { type: string } }
    ExtractionResult:
      type: object
      required: [complaint, riskAssessment, missingFields, processingStage]
      properties:
        complaint: { $ref: "#/components/schemas/ComplaintFields" }
        riskAssessment: { $ref: "#/components/schemas/RiskAssessment" }
        missingFields: { type: array, items: { type: string } }
        processingStage: { type: string }
    CopilotMessage:
      type: object
      required: [message, complaint]
      properties:
        message: { type: string }
        complaint: { $ref: "#/components/schemas/ComplaintFields" }
        riskAssessment: { $ref: "#/components/schemas/RiskAssessment" }
    CopilotReply:
      type: object
      required: [reply]
      properties:
        reply: { type: string }
    ComplaintInput:
      type: object
      required: [complaint, riskAssessment]
      properties:
        complaint: { $ref: "#/components/schemas/ComplaintFields" }
        riskAssessment: { $ref: "#/components/schemas/RiskAssessment" }
        documentName: { type: string }
        documentType: { type: string }
    ComplaintRecord:
      type: object
      required: [id, complaint, riskAssessment, createdAt, updatedAt]
      properties:
        id: { type: number }
        complaint: { $ref: "#/components/schemas/ComplaintFields" }
        riskAssessment: { $ref: "#/components/schemas/RiskAssessment" }
        documentName: { type: string }
        documentType: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

